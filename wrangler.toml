#:schema node_modules/wrangler/config-schema.json
name = "planetary-max"
main = "server/planetary-max-submissions.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"
PROTOCOL_VERSION = "DAT-JURREAUISM-v1"
PRE_TIER_INDEX = "IDX-PRETIER-001"
ISOLATE_MEMORY_LIMIT_MB = "128"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "eccf7361ba5d474293001409bc085b07"

[[d1_databases]]
binding = "DB"
database_name = "planetary-max-ledger"
database_id = "26f79d62-306d-4258-970d-b218cddabe8f"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "NODE_REGISTRY"
class_name = "NodeRegistryDO"

[[durable_objects.bindings]]
name = "BEEMAX_SECURE_REGISTRY"
class_name = "BEEMAXSecureNodeRegistryDO"

[[migrations]]
tag = "v1-node-registry"
new_sqlite_classes = ["NodeRegistryDO"]

[[migrations]]
tag = "v2-secure-registry"
new_sqlite_classes = ["BEEMAXSecureNodeRegistryDO"]
